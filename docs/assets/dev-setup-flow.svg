<svg xmlns="http://www.w3.org/2000/svg" class="tk-svg" viewBox="0 0 400 552" role="img" aria-labelledby="tk-dev-title tk-dev-desc">
<title id="tk-dev-title">Developer setup from source</title>
<desc id="tk-dev-desc">Six steps. 1, copy .env.example to .env and backend/.env.example to backend/.env. 2, create and activate the tckdb_env conda environment. 3, pip install the tckdb-schemas package, then the backend with its dev extra. 4, make up starts the database and SeaweedFS and runs migrations. 5, make api starts the API on 127.0.0.1:8010. 6, curl the health endpoint and expect status ok.</desc>
<style>
.tk-svg{color:var(--md-default-fg-color,#1f2328);font-family:var(--md-text-font-family,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif)}
.tk-svg text{fill:currentColor}
.tk-svg .tk-box{fill:var(--md-default-bg-color,#fff);stroke:currentColor;stroke-opacity:.3;stroke-width:1.2}
.tk-svg .tk-num{fill:var(--md-primary-fg-color,#546e7a)}
.tk-svg .tk-numtxt{fill:#fff;font-weight:700;font-size:14px}
.tk-svg .tk-rail{stroke:currentColor;stroke-opacity:.4;stroke-width:1.5;fill:none}
.tk-svg .tk-h{font-size:14.5px;font-weight:700}
.tk-svg .tk-c{font-family:var(--md-code-font-family,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace);font-size:11.5px}
.tk-svg .tk-d{font-size:12px;fill-opacity:.75}
</style>
<defs>
<marker id="tk-dev-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" fill-opacity=".55"/></marker>
</defs>
<path class="tk-rail" d="M22 54V114" marker-end="url(#tk-dev-arrow)"/>
<path class="tk-rail" d="M22 146V206" marker-end="url(#tk-dev-arrow)"/>
<path class="tk-rail" d="M22 238V298" marker-end="url(#tk-dev-arrow)"/>
<path class="tk-rail" d="M22 330V390" marker-end="url(#tk-dev-arrow)"/>
<path class="tk-rail" d="M22 422V482" marker-end="url(#tk-dev-arrow)"/>
<rect class="tk-box" x="46" y="10" width="346" height="74" rx="8"/>
<circle class="tk-num" cx="22" cy="36" r="14"/><text class="tk-numtxt" x="22" y="41" text-anchor="middle">1</text>
<text class="tk-h" x="60" y="33">Copy the env files</text>
<text class="tk-c" x="60" y="53">cp .env.example .env</text>
<text class="tk-c" x="60" y="72">cp backend/.env.example backend/.env</text>
<rect class="tk-box" x="46" y="102" width="346" height="74" rx="8"/>
<circle class="tk-num" cx="22" cy="128" r="14"/><text class="tk-numtxt" x="22" y="133" text-anchor="middle">2</text>
<text class="tk-h" x="60" y="125">Create the conda env</text>
<text class="tk-c" x="60" y="145">mamba env create -n tckdb_env …</text>
<text class="tk-d" x="60" y="164">Then: conda activate tckdb_env</text>
<rect class="tk-box" x="46" y="194" width="346" height="74" rx="8"/>
<circle class="tk-num" cx="22" cy="220" r="14"/><text class="tk-numtxt" x="22" y="225" text-anchor="middle">3</text>
<text class="tk-h" x="60" y="217">Install the Python packages</text>
<text class="tk-c" x="60" y="237">pip install -e schemas/python/tckdb-schemas</text>
<text class="tk-c" x="60" y="256">cd backend &amp;&amp; pip install -e ".[dev]"</text>
<rect class="tk-box" x="46" y="286" width="346" height="74" rx="8"/>
<circle class="tk-num" cx="22" cy="312" r="14"/><text class="tk-numtxt" x="22" y="317" text-anchor="middle">4</text>
<text class="tk-h" x="60" y="309">Start Postgres and SeaweedFS</text>
<text class="tk-c" x="60" y="329">make up</text>
<text class="tk-d" x="60" y="348">Starts db and seaweedfs, then migrates.</text>
<rect class="tk-box" x="46" y="378" width="346" height="74" rx="8"/>
<circle class="tk-num" cx="22" cy="404" r="14"/><text class="tk-numtxt" x="22" y="409" text-anchor="middle">5</text>
<text class="tk-h" x="60" y="401">Start the API</text>
<text class="tk-c" x="60" y="421">make api</text>
<text class="tk-d" x="60" y="440">Runs in the foreground on 127.0.0.1:8010.</text>
<rect class="tk-box" x="46" y="470" width="346" height="74" rx="8"/>
<circle class="tk-num" cx="22" cy="496" r="14"/><text class="tk-numtxt" x="22" y="501" text-anchor="middle">6</text>
<text class="tk-h" x="60" y="493">Check it</text>
<text class="tk-c" x="60" y="513">curl 127.0.0.1:8010/api/v1/health</text>
<text class="tk-d" x="60" y="532">Expect {"status":"ok"}.</text>
</svg>
