map $http_x_real_ip $tckdb_real_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

map $http_x_forwarded_proto $tckdb_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep browser calls same-origin. The API container is already named
    # tckdb-api and attached to tckdbv2_default on the Pi; no public API port
    # is needed for the frontend-to-API hop.
    location /api/ {
        # Just above the API's 5 MiB bundle cap (bundle_max_body_bytes), so an
        # oversized bundle gets TCKDB's own bundle_too_large error rather than
        # nginx's bare 413 at the 1 MiB default. Kept small on purpose: the API
        # reads and parses a body before it checks the caller's credentials,
        # so this is also the most an anonymous request can make it hold.
        client_max_body_size 6m;

        # Docker assigns a new IP when tckdb-api is recreated. A variable
        # forces nginx to ask Docker DNS instead of retaining the address it
        # saw at nginx startup; the short cache bounds failover after a swap.
        resolver 127.0.0.11 valid=1s ipv6=off;
        set $tckdb_api_upstream tckdb-api;
        proxy_pass http://$tckdb_api_upstream:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $tckdb_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tckdb_forwarded_proto;
    }

    # The routes that carry ESS logs inline (artifact uploads, async upload
    # jobs, artifacts added to a calculation) take up to 100m. That fits one
    # maximum-size artifact (50 MB, about 67 MB base64; artifact_storage.py)
    # but not the API's 200 MB per-upload total, so a multi-artifact upload
    # over 100 MB is refused here (or by an edge proxy) with a bare 413, not
    # by TCKDB. Behind Cloudflare, whose Free/Pro maximum upload size is
    # 100 MB (developers.cloudflare.com/support/troubleshooting/http-status-codes/4xx-client-error/error-413/),
    # nginx is not the tighter limit.
    location ~ ^/api/v1/(uploads|jobs)/|^/api/v1/calculations/[^/]+/artifacts$ {
        client_max_body_size 100m;

        # Docker assigns a new IP when tckdb-api is recreated. A variable
        # forces nginx to ask Docker DNS instead of retaining the address it
        # saw at nginx startup; the short cache bounds failover after a swap.
        resolver 127.0.0.11 valid=1s ipv6=off;
        set $tckdb_api_upstream tckdb-api;
        proxy_pass http://$tckdb_api_upstream:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $tckdb_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tckdb_forwarded_proto;
    }

    # Vite hashes assets, so they can be cached indefinitely. index.html is
    # deliberately not cached: it names the current hashed asset set.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router owns application routes such as /species/CH3. Requests for
    # real files still win; every other route receives the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
