map $http_x_real_ip $tckdb_real_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

map $http_x_forwarded_proto $tckdb_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep browser calls same-origin. The API container is already named
    # tckdb-api and attached to tckdbv2_default on the Pi; no public API port
    # is needed for the frontend-to-API hop.
    #
    # Docker assigns a new IP when tckdb-api is recreated. A variable forces
    # nginx to ask Docker DNS instead of retaining the address it saw at
    # nginx startup; the short cache bounds failover after a swap. These sit
    # at server level so both API locations below inherit one copy (neither
    # may set its own proxy_set_header, or it stops inheriting these).
    resolver 127.0.0.11 valid=1s ipv6=off;
    set $tckdb_api_upstream tckdb-api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $tckdb_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $tckdb_forwarded_proto;

    location /api/ {
        # Above the two body caps the API enforces before parsing, so a
        # request over either gets TCKDB's own coded 413 rather than nginx's
        # bare one at the 1 MiB default: bundles (5 MiB, bundle_max_body_bytes)
        # and a network kinetics export manifest posted back (9 MiB,
        # app/api/export_limits.py). A request with no valid credential is
        # refused by the API (413 anonymous_body_too_large) before it reads
        # a body over anonymous_max_body_bytes (1 MiB), except the export
        # route, which keeps its own 9 MiB cap. nginx still buffers the whole
        # body (proxy_request_buffering on) before the API sees the headers,
        # so that limit protects the API's memory and CPU, not nginx's disk
        # or bandwidth.
        client_max_body_size 10m;
        error_page 413 @request_body_too_large_10m;
        proxy_pass http://$tckdb_api_upstream:8010;
    }

    # Upload and job routes (several carry ESS logs inline) and artifacts
    # added to a calculation take up to 100m. That fits one maximum-size
    # artifact (50 MB, about 67 MB base64; artifact_storage.py) but not the
    # API's 200 MB per-upload total, so a multi-artifact upload over 100 MB
    # is refused here with TCKDB's coded 413 (request_body_too_large, see the
    # named locations below) or, at an edge proxy's lower limit, by that proxy.
    # Behind Cloudflare, whose Free/Pro maximum upload size is 100 MB
    # (developers.cloudflare.com/support/troubleshooting/http-status-codes/4xx-client-error/error-413/),
    # nginx is not the tighter limit. The API refuses an unauthenticated body
    # over anonymous_max_body_bytes (413 anonymous_body_too_large) before
    # reading it. nginx still buffers up to 100m per anonymous request to the
    # container's disk before the API sees the headers
    # (proxy_request_buffering on), so that limit protects the API's memory
    # and CPU, not nginx's disk or bandwidth.
    location ~ ^/api/v1/(uploads|jobs)/|^/api/v1/calculations/[^/]+/artifacts$ {
        client_max_body_size 100m;
        error_page 413 @request_body_too_large_100m;
        proxy_pass http://$tckdb_api_upstream:8010;
    }

    # A body over client_max_body_size gets TCKDB's coded 413 (request_body_too_large, context.max_bytes
    # = the cap). The text is pinned to app/api/proxy_body_limit.py by tests/api/test_proxy_body_limit.py.
    # The API's own 413s pass through unchanged (proxy_intercept_errors is off).
    location @request_body_too_large_10m {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 413 '{"code":"request_body_too_large","detail":"The request body is larger than the 10,485,760 bytes the server accepts on this route. Send a smaller body.","context":{"max_bytes":10485760}}';
    }

    location @request_body_too_large_100m {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 413 '{"code":"request_body_too_large","detail":"The request body is larger than the 104,857,600 bytes the server accepts on this route. Send a smaller body.","context":{"max_bytes":104857600}}';
    }

    # Vite hashes assets, so they can be cached indefinitely. index.html is
    # deliberately not cached: it names the current hashed asset set.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router owns application routes such as /species/CH3. Requests for
    # real files still win; every other route receives the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
