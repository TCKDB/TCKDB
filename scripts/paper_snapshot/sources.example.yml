# Sources for the paper snapshot build. Copy, edit the paths, pass with --sources.
#
# The values below match the README's "Run it" steps: `make up` (database tckdb_dev on 127.0.0.1:5432, store at
# localhost:9000) and `make api` (port 8010). Point them at any other empty instance.
#
# A source with no entry here is skipped, and the build says so. An entry that is enabled but cannot be built
# (a missing path, an unknown level, a stub source) stops the build before anything is deposited.
# Large source files are read from these paths; none is copied into the repository.

instance:
  api_url: http://127.0.0.1:8010
  # The archive export and the curator account read/write the instance's database directly, so the build needs to
  # know it. Anything left out falls back to DB_* / S3_* in the environment.
  database:
    host: 127.0.0.1
    port: 5432
    name: tckdb_dev
    user: tckdb
    password: tckdb
  s3:
    endpoint_url: http://localhost:9000
    access_key: tckdb
    secret_key: tckdb_secret
    bucket: tckdb-artifacts

sources:
  # Source 1: the E2 conformer study, deposited with the client builders.
  # The directory must hold raw_outputs/manifest_union.json, raw_outputs/tasks.txt and
  # raw_outputs/tasks/<level>/<molecule>/<start>/ (job.log, job.gjf for Gaussian; xtb.out, g98.out, start.xyz for xtb).
  # It is not in this repository.
  e2_conformers:
    enabled: true
    root: /path/to/E2
    levels: [b3lyp_d3bj, wb97xd, gfn2]

  # Source 4: the formic acid RMG model (Wu and Grinberg Dana, ACS Omega 2026), unmodified, through the CHEMKIN
  # adapter. The files ship in this repository; the path is relative to the repository root.
  chemkin_formic_acid:
    enabled: true
    fixture_dir: backend/tests/integration/fixtures/rmg_formic_acid_wu2026
    mechanism_file: chem_annotated.inp
    species_dictionary: species_dictionary.txt
    scientific_origin: estimated

  # Source 2: ARC runs through the ARC adapter, deposited in the order listed. Each folder holds output/output.yml and a
  # tckdb block (tckdb_upload.yml, else input.yml); the block's API URL, key settings and payload directory are replaced
  # by the build's, and a block naming a host not in recorded_hosts stops the build.
  # arc_runs:
  #   enabled: true
  #   adapter_command: [conda, run, --no-capture-output, -n, arc_env, python]
  #   adapter_path: /path/to/tckdb-adapters
  #   arc_path: /path/to/ARC
  #   timeout_seconds: 900
  #   rights: {license: CC-BY-4.0, depositor_attests_right_to_license: true}
  #   runs_root: /path/to/arc/runs
  #   recorded_hosts: [tckdb.example.org]
  #   runs:
  #   - snapshot_reruns_20261110/rotor_scan_rmg_rxn_1142
  #   - snapshot_reruns_20261110/rotor_scan_rxn_188
  #   - snapshot_reruns_20261110/rotor_scan_rxn_209
  #   - snapshot_reruns_20261110/rotor_scan_rxn_298
  #   - snapshot_reruns_20261110/rotor_scan_rxn_998
  #   - snapshot_reruns_20261110/rotor_scan_rxn_30_r2
  #   - snapshot_reruns_20261110/arc_tckdb_neb
  #   - snapshot_reruns_20261111/arc_tckdb_demo_reaction
  #   - snapshot_reruns_20261109/rotor_scan_rxn_210
  #   - snapshot_reruns_20261109/rotor_scan_rxn_392
  #   - snapshot_reruns_20261109/rotor_scan_rxn_476
  #   - snapshot_reruns_20261109/rotor_scan_rxn_682
  #   - tckdb_test_20261109/04_ho2_elimination_from_peroxyradical
  #   - tckdb_test_20261109/06_intra_disproportionation
  #   - tckdb_test_20261109/14_r_addition_multiplebond
  #   - tckdb_test_20261109/r2_05_h_abstraction
  #   - tckdb_test_20261109/r2_14_r_addition_multiplebond
  #   - tckdb_test_20261109/r4_14_xy_addition_multiplebond
  #   - tckdb_test_20261109/r4_15_intra_h_migration
  #   - tckdb_test_20261109_thermo/09_intra_r_add_endocyclic
  #   - tckdb_test_20261109_thermo/13_ketoenol
  #   - tckdb_test_20261110/19_intra_no2_ono_conversion
  #   - snapshot_reruns_20261110/rotor_scan_rxn_30

  # Source 3: the N2H3 pressure-dependent network (Keslin et al., PCCP 2025), through the PDep ingester. The directory
  # must hold the Arkane run's input.py, output.py and supporting_information.csv.
  # pdep_network:
  #   enabled: true
  #   arkane_dir: /path/to/Final_Final_CCSDT_F12_Aug_F12

