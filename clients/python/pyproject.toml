[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tckdb-client"
version = "0.207.0"
description = "Synchronous Python HTTP client and scientific upload builders for the TCKDB API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TCKDB" }]
keywords = [
    "tckdb",
    "thermochemistry",
    "kinetics",
    "transport",
    "statmech",
    "client",
    "http",
    "computational chemistry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    # License is expressed via the ``license`` table above; the
    # ``License :: OSI Approved :: MIT License`` classifier is
    # deprecated in PEP 639 / setuptools 77+ and is intentionally not
    # listed here.
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    # The wire package ships breaking changes between minors (0.33.0 alone
    # removed `literature_id` from `CalculationPayload`), so an open range
    # would let a resolver pick a release the client imports cleanly and
    # then fails with at upload time.
    #
    # The window is >=0.158,<0.173: the floor is the schemas release this
    # client release was built and tested with, and the in-repo schemas
    # version must stay inside the window.
    # See clients/python/docs/development.md ("The tckdb-schemas window").
    "tckdb-schemas>=0.158,<0.175",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
# Optional: pull in the Jupyter stack used to author + execute
# ``examples/builder_computed_reaction_demo.ipynb``. The executable
# smoke test ``test_builder_computed_reaction_demo_notebook.py``
# auto-skips when these aren't installed, so the base ``test`` extra
# stays slim for CI environments that don't care about the notebook.
notebook = [
    "jupyter>=1.0",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel>=6",
]

[project.scripts]
tckdb-replay = "tckdb_client.cli:main"
tckdb = "tckdb_client.cli:main_tckdb"

[project.urls]
Homepage = "https://github.com/TCKDB/TCKDB"
Repository = "https://github.com/TCKDB/TCKDB"
Issues = "https://github.com/TCKDB/TCKDB/issues"
Documentation = "https://github.com/TCKDB/TCKDB/tree/main/clients/python"
Changelog = "https://github.com/TCKDB/TCKDB/blob/main/clients/python/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tckdb_client = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
