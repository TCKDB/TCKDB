[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tckdb-chemkin"
version = "0.7.5"
description = "CHEMKIN mechanism importer adapter for TCKDB (parser + identity + payload builder + uploader)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TCKDB" }]
keywords = [
    "tckdb",
    "chemkin",
    "kinetics",
    "thermochemistry",
    "transport",
    "mechanism",
    "computational chemistry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]
dependencies = [
    # tckdb-client is 0.x and a minor may break, so the window holds the
    # client line this release was tested with. Move it, and bump this
    # package, before releasing against a newer client.
    "tckdb-client>=0.208,<0.209",
    # Every import resolves species identity, and identity needs RDKit.
    "rdkit>=2024.3",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tckdb-chemkin-import = "tckdb_chemkin.cli:main"

[project.urls]
Homepage = "https://github.com/TCKDB/TCKDB"
Repository = "https://github.com/TCKDB/TCKDB"
Issues = "https://github.com/TCKDB/TCKDB/issues"
Documentation = "https://tckdb.github.io/TCKDB/"
Source = "https://github.com/TCKDB/TCKDB/tree/main/clients/python/adapters/chemkin"
Changelog = "https://github.com/TCKDB/TCKDB/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["tckdb_chemkin"]

[tool.setuptools.package-data]
tckdb_chemkin = ["py.typed"]
