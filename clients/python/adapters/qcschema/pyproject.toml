[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tckdb-qcschema"
version = "0.9.1"
description = "MolSSI QCSchema (QCElemental) import/export adapter for TCKDB (family dispatch + mapping + uploader + exporter)."
requires-python = ">=3.11"
dependencies = [
    "tckdb-client>=0.160.0",
    "tckdb-schemas>=0.131.0",
    "qcelemental==0.51.2",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tckdb-qcschema = "tckdb_qcschema.cli:main"

[tool.setuptools]
packages = ["tckdb_qcschema"]
