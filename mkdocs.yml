site_name: TCKDB
site_description: Theoretical Chemical Kinetics Database documentation
site_url: https://tckdb.github.io/TCKDB/
repo_url: https://github.com/TCKDB/TCKDB
repo_name: TCKDB/TCKDB
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/tckdb-mark-transparent.png
  favicon: assets/tckdb-mark-transparent.png
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

hooks:
  - docs/hooks/repo_links.py

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: ignore
  links:
    not_found: warn
    absolute_links: ignore
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Install locally: start/getting-started.md
      - Load demo data: start/demo-data.md
      - Query: start/querying.md
      - Upload: start/uploads.md
  - Hosting TCKDB:
      - deployment/README.md
      - Which setup do I need?: deployment/deployment_modes.md
      - Local development: deployment/local-v0.md
      - Self-hosted single node: deployment/self_hosted_single_node.md
      - Shared private (lab): deployment/shared-private-deployment.md
      - Clients from HPC: deployment/client-access-from-hpc.md
      - Without Docker: deployment/native-advanced.md
      - Admin accounts and API keys: deployment/admin_auth_quickstart.md
      - Production checklist: deployment/production_checklist.md
      - Troubleshooting: deployment/troubleshooting.md
  - Querying:
      - Public read API: guides/public_hosted_querying.md
      - Query cookbook: guides/scientific_query_cookbook.md
      - From a workflow tool: guides/workflow_tool_scientific_reads.md
      - Selecting thermo for H298: guides/selecting_thermo_for_h298.md
      - Selecting structures: guides/selecting_structures.md
      - Selecting statmech models: guides/selecting_statmech_models.md
      - Selecting kinetics: guides/selecting_kinetics.md
      - Selecting network kinetics: guides/selecting_network_kinetics.md
      - Relative conformer energies: guides/relative_conformer_energies.md
  - Depositing:
      - Thermo record: guides/depositing_a_thermo_record.md
      - Kinetics record: guides/declaring_a_kinetics_record.md
      - Structure evidence: guides/declaring_structure_evidence.md
      - Statmech models: guides/declaring_statmech_models.md
      - Network solve: guides/declaring_a_network_solve.md
      - Contribution bundles:
          - Bundle format: contribution-bundles/format.md
          - Export a bundle: contribution-bundles/local-export.md
          - Dry run on a hosted instance: contribution-bundles/hosted-dry-run.md
          - Submit to a hosted instance: contribution-bundles/hosted-submit.md
          - Local to hosted, step by step: contribution-bundles/manual-local-to-hosted.md
      - Configuring a client: clients/generic-client-targeting.md
  - Concepts:
      - Core concepts: guides/core_concepts.md
  - Reference:
      - API vocabulary (generated): guides/api_vocabulary.md
      - Schema reference (generated): guides/schema_reference.md
      - Scientific check register (generated): guides/scientific_check_register.md

# Pages kept in the repository but not published on the site:
# maintainer notes, design records, plans, reviews, implementation specs,
# and pages superseded by a published one.
exclude_docs: |
  /*.md
  /requirements.txt
  !/index.md
  adr/
  audits/
  decisions/
  hooks/
  paper/
  plans/
  proposals/
  research/
  reviews/
  roadmaps/
  specs/
  validation/
  deployment/api_containerization_notes.md
  deployment/frontend-pi.md
  deployment/self_hosting.md
  guides/scientific_read_demo_data.md
  guides/system_flow.md
  guides/the_story_of_a_datapoint.md
  start/deployment.md
