name: Python Client CI

on:
  pull_request:
    paths:
      - ".github/workflows/python-client-ci.yml"
      - "clients/python/**"
      - "schemas/python/tckdb-schemas/**"
      # tests/test_openapi_parity.py requires every backend operation to
      # be triaged in tckdb_client._parity -- a check that exists to catch
      # the client silently falling behind the *backend*, so it must run
      # when the backend API surface changes, not only when clients/python
      # itself does. #276 added GET /species/browse without a matching
      # _parity.py entry and this workflow never ran, because nothing
      # under clients/python or schemas/python changed. backend/app/api/**
      # covers new/changed routes directly; the golden OpenAPI snapshot
      # covers the rest (a route-adjacent schema change that alters the
      # live spec without touching a route file) because
      # backend/tests/api/test_openapi_snapshot.py already requires that
      # file to be regenerated whenever the live schema changes, so it is
      # the one file guaranteed to move whenever the operation set does.
      - "backend/app/api/**"
      - "backend/tests/api/golden/openapi.json"
      # clients/python/tests/test_relative_conformer_energy.py reads the closed
      # comparison vocabularies out of this one file, so a change to them must
      # run the client suite. The exact file, not a glob over services.
      - "backend/app/services/relative_conformer_energy/compare.py"
      # The package-metadata job builds tckdb-mcp too.
      - "integrations/mcp/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/python-client-ci.yml"
      - "clients/python/**"
      - "schemas/python/tckdb-schemas/**"
      - "backend/app/api/**"
      - "backend/tests/api/golden/openapi.json"
      - "backend/app/services/relative_conformer_energy/compare.py"
      - "integrations/mcp/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Gates the client and the wire-contract schemas. The CHEMKIN and
    # QCSchema adapters are tested in the tckdb-adapters repository; the
    # name is kept because required checks refer to it.
    name: Client, adapter, and wire-contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml

      - name: Install worktree schemas, client, and test dependencies
        run: |
          python -m pip install -e schemas/python/tckdb-schemas
          python -m pip install -e "clients/python[test,notebook]"

      # Two invocations, not one. `testpaths = ["tests"]` in
      # clients/python/pyproject.toml means a bare `pytest` there sees only
      # tests/, and the schemas package has its own suite;
      # backend/tests/scripts/test_gate_coverage.py is what stops another
      # suite from being added without a step to run it.
      - name: Run Python client tests
        working-directory: clients/python
        run: python -m pytest

      # The wire contract every client and the backend share. Two workflows
      # installed this package; neither ran its tests, so 38 round-trip and
      # import-boundary tests over the schemas gated nothing.
      - name: Run wire-contract schema tests
        working-directory: schemas/python/tckdb-schemas
        run: python -m pytest

  package-metadata:
    # Builds every distribution .github/workflows/publish-python.yml can
    # publish and checks its metadata the way PyPI will, so a missing readme
    # or a malformed field fails here and not on release day.
    name: Package build and metadata check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install "build>=1.2" "twine>=6.1"

      - name: Build every published package and check its metadata
        run: |
          for dir in \
              schemas/python/tckdb-schemas \
              clients/python \
              integrations/mcp; do
            python -m build --outdir "dist/$(basename "$dir")" "$dir"
          done
          python -m twine check --strict dist/*/*
