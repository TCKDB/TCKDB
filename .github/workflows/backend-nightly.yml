name: Backend Nightly (full suite)

# This runs the complete test suite (backend/scripts/test-full.sh, ~6,800
# tests) in an order nobody chose.
#
# It is no longer the only job that runs the whole suite. backend-ci.yml's
# three gates cover backend/tests/ between them, so a PR now runs every test
# this job does; what this job adds is the *order*. The PR gates pin a seed so
# a red gate means a regression rather than an unlucky draw, which is only
# honestly reproducibility if something still draws -- hence TCKDB_TEST_SEED
# below. A defect that depends on test order therefore still surfaces here
# first, and a defect that does not now surfaces on the PR that causes it,
# which is where it is attributable.
#
# A red run here notifies nobody by itself: GitHub does not email about a
# failed scheduled workflow and it leaves no mark on any PR, which is how this
# job came to fail eleven nights in a row unnoticed. ci-watchdog.yml reads this
# workflow's run history once a day and pushes to ntfy on a change of verdict,
# and on this job going silent as well as on it going red.

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: informaticsmatters/rdkit-cartridge-debian:Release_2025_03_3
        env:
          POSTGRES_USER: tckdb
          POSTGRES_PASSWORD: tckdb
          POSTGRES_DB: tckdb_nightly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tckdb -d tckdb_nightly_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      minio:
        image: minio/minio:latest
        command: server /data --address ":9000"
        env:
          MINIO_ROOT_USER: tckdb
          MINIO_ROOT_PASSWORD: tckdb_secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: tckdb
      DB_PASSWORD: tckdb
      # Exists and is never migrated -- and since backend-ci.yml moved its
      # `alembic upgrade head` onto a scratch database, that is now the same
      # condition the PR gates present rather than a difference between the
      # two workflows. It was the difference that mattered: five /status tests
      # reached this database outside any fixture, found a migrated schema on
      # CI and an empty one here, and so failed only at night, attached to no
      # PR (#64 cause 2, #92). Nothing should migrate this name. If a test
      # starts needing it migrated, that test is coupled to something no
      # fixture owns, and the fix belongs in the test.
      #
      # `tckdb_nightly_ci`, not `tckdb_test_ci`: the `tckdb_test%` namespace
      # belongs to the harness, and everything in it is by definition something
      # a reclaimer may drop. This job's ambient database was inside it and was
      # therefore reclaimable -- defended by naming it in the reclaim script's
      # PROTECTED set (#126), which fixes this one name and leaves the class.
      # A long-lived database that no fixture owns has no business in the
      # harness's namespace at all, so it left, and PROTECTED lost its only
      # non-obvious entry. See backend/scripts/dev/reclaim_leaked_test_databases.py.
      # DB_TEST_NAME below stays inside `tckdb_test` on purpose: that one *is*
      # the harness's, and must be reclaimable.
      DB_NAME: tckdb_nightly_ci
      DB_CLIENT_ENCODING: utf8
      DB_TEST_NAME: tckdb_test_${{ github.run_id }}_${{ github.run_attempt }}
      # See the note in backend-ci.yml: 4 vCPUs on a standard runner, and each
      # worker creates and migrates its own database.
      TCKDB_TEST_WORKERS: "4"
      # The PR gates pin the order so a red gate is a regression rather than an
      # unlucky draw. Something still has to run an order nobody chose, or the
      # suite is only ever proved against the one ordering the pin selects --
      # and a nightly is exactly the job that can afford to draw a new one.
      # pytest-randomly prints the seed it drew, so anything this finds is
      # reproducible with TCKDB_TEST_SEED=<that value>.
      TCKDB_TEST_SEED: random
      AUTH_ALLOW_OPEN_REGISTRATION: "true"
      DEPLOYMENT_MODE: local
      EXPOSE_API_DOCS: "true"
      LEGACY_READS_REQUIRE_AUTH: "false"
      SESSION_COOKIE_SECURE: "false"
      RATE_LIMIT_ENABLED: "false"
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY: tckdb
      S3_SECRET_KEY: tckdb_secret
      S3_BUCKET: tckdb-artifacts-test
      S3_REGION: us-east-1

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          environment-file: backend/environment.yml
          activate-environment: tckdb_env
          auto-activate-base: false

      - name: Install backend packages
        run: |
          conda run -n tckdb_env python -m pip install --upgrade pip
          conda run -n tckdb_env python -m pip install -e schemas/python/tckdb-schemas
          conda run -n tckdb_env python -m pip install -e "backend[dev]"

      - name: Initialize artifact bucket
        # See the twin step in backend-ci.yml: as `conda run python - <<'PY'`
        # this provisioned nothing, because `conda run` does not forward stdin
        # and a silent step is indistinguishable from a successful one. Written
        # to a file, run by path, and made to print what it did.
        run: |
          cat > "${RUNNER_TEMP}/init_artifact_bucket.py" <<'PY'
          import os

          import boto3
          from botocore.client import Config
          from botocore.exceptions import ClientError

          bucket = os.environ["S3_BUCKET"]
          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["S3_ENDPOINT_URL"],
              aws_access_key_id=os.environ["S3_ACCESS_KEY"],
              aws_secret_access_key=os.environ["S3_SECRET_KEY"],
              region_name=os.environ["S3_REGION"],
              config=Config(signature_version="s3v4"),
          )

          try:
              s3.head_bucket(Bucket=bucket)
              print(f"artifact bucket already present: {bucket}")
          except ClientError:
              s3.create_bucket(Bucket=bucket)
              print(f"created artifact bucket: {bucket}")
          PY
          conda run -n tckdb_env python "${RUNNER_TEMP}/init_artifact_bucket.py"

      - name: Full test suite
        run: conda run -n tckdb_env bash backend/scripts/test-full.sh
