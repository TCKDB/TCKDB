name: build-frontend-image

# Publish the browser UI only after a container has served an SPA route and
# proxied an /api/ request on a Docker network. This is intentionally separate
# from build-api-image.yml: a frontend-only change must not rebuild the heavy
# scientific API image.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend-image.yml'
    tags:
      - 'v*'
  workflow_dispatch:

# Each platform is built natively (amd64 on ubuntu-latest, arm64 on GitHub's
# free native arm64 runner), pushed by digest, and joined into one multi-arch
# manifest list by the merge job. No step runs under QEMU: the emulated arm64
# build once hung until GitHub's 6-hour default timeout (run 36822906978).
# Pattern: https://docs.docker.com/build/ci/github-actions/multi-platform/
env:
  REGISTRY_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tckdb-frontend

jobs:
  build:
    if: github.repository == 'TCKDB/TCKDB'
    name: build (${{ matrix.platform }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Labels only; tags are computed once in the merge job.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Build image for smoke testing
        timeout-minutes: 25
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: tckdb-frontend:smoketest
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.arch }}

      - name: Smoke test — SPA fallback and same-origin API proxy
        timeout-minutes: 10
        run: |
          set -euo pipefail
          docker network create --subnet 172.30.252.0/24 frontend-smoke-net
          docker run -d --name tckdb-api --network frontend-smoke-net \
            -v "$PWD/frontend/scripts/ops/smoke_api.py:/app/smoke_api.py:ro" \
            -e API_RESPONSE=api-old python:3.13-alpine python /app/smoke_api.py
          docker run -d --name frontend-smoke --network frontend-smoke-net -p 18080:8080 \
            tckdb-frontend:smoketest

          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18080/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/species/CH3 | grep -q '<div id="root">'
          api_old_status() {
            curl -fsS -H 'X-Real-IP: 203.0.113.9' -H 'X-Forwarded-Proto: https' \
              http://127.0.0.1:18080/api/v1/status \
              | jq -e \
                '(.response == "api-old") and
                 (.headers.x_real_ip == "203.0.113.9") and
                 (.headers.x_forwarded_proto == "https")'
          }
          for _ in $(seq 1 20); do
            api_old_status && break
            sleep 1
          done
          api_old_status

          # Docker gives the replacement API a different IP. The frontend is
          # intentionally left running: this proves nginx re-resolves Docker
          # DNS instead of retaining the first container's address.
          old_api_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' tckdb-api)"
          docker rm -f tckdb-api
          docker run -d --name api-ip-reservation --network frontend-smoke-net --ip "$old_api_ip" \
            alpine:3.21 sleep infinity
          docker run -d --name tckdb-api --network frontend-smoke-net \
            -v "$PWD/frontend/scripts/ops/smoke_api.py:/app/smoke_api.py:ro" \
            -e API_RESPONSE=api-new python:3.13-alpine python /app/smoke_api.py
          new_api_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' tckdb-api)"
          test "$old_api_ip" != "$new_api_ip"
          sleep 2
          curl -fsS http://127.0.0.1:18080/api/v1/status | jq -e '.response == "api-new"'

          docker rm -f frontend-smoke tckdb-api api-ip-reservation
          docker network rm frontend-smoke-net

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push by digest
        id: push
        timeout-minutes: 25
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.repository == 'TCKDB/TCKDB'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same tags: block as before the split, so every tag is unchanged.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          [ "$(ls | wc -l)" = "2" ] || { echo "::error::expected 2 digests, got: $(ls)"; exit 1; }
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect manifest list
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE }}:sha-${{ github.sha }}"
