name: Repo Gate

# The one job with no path filter.
#
# WHAT IT CHECKS
#   That every test_*.py in the repository is run by a required job, and
#   that the job which runs it can actually be reached by a change to it.
#   See backend/tests/scripts/test_gate_coverage.py for the property and
#   for the four separate ways it had already stopped holding.
#
# WHY IT IS ITS OWN WORKFLOW
#   Every other workflow here is path-filtered, which is correct for them
#   and fatal for this one. The failure being guarded against is "somebody
#   adds a test directory that no job runs" -- and a new directory is, by
#   construction, outside whatever filters exist today. Backend CI would
#   not fire for a pull request that only adds clients/python/adapters/
#   <new>/tests/, so the guard has to live somewhere that always fires.
#   test_repo_gate_is_not_path_filtered pins that back.
#
# WHY IT DOES NOT USE THE CONDA ENVIRONMENT
#   It runs on every pull request, including documentation-only ones, so
#   it has to be cheap: stock Python plus pytest and PyYAML, about twenty
#   seconds end to end against roughly six minutes to provision
#   tckdb_env. The guard reads YAML and shell text and touches no
#   database, no application code and no scientific dependency. It is run
#   with --noconftest because backend/tests/conftest.py builds a
#   PostgreSQL fixture stack this job deliberately does not have; if the
#   guard ever acquires a dependency on that stack, this step fails
#   loudly rather than the guard quietly becoming un-runnable here.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-coverage:
    name: CI gate coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history, not the depth-1 default. The package version guard
          # below compares against the *merge base* of this branch and the
          # base branch, and a shallow clone has no merge base to compute --
          # git would fail rather than quietly find nothing, but only
          # because check_package_version_bump.py refuses that case
          # explicitly. test_the_gate_has_the_history_it_needs pins this.
          fetch-depth: 0
          # And tags, which fetch-depth: 0 does NOT bring on its own -- the
          # action passes --no-tags unless asked for them. Without this the
          # guard's third check ("is this version already pinned by a
          # <name>-v<version> tag?") would see an empty tag list, find no
          # conflict, and sit there inert while reporting green. That is the
          # exact shape of failure this whole gate exists to prevent, so it
          # would be a poor one to build into it.
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install check dependencies
        run: python -m pip install "pytest>=8" "PyYAML>=6"

      - name: Every test file is run by a required job
        run: python -m pytest --noconftest -q backend/tests/scripts/test_gate_coverage.py

      # WHY THE VERSION GUARD IS HERE AND NOT IN python-client-ci.yml
      #   Two agents branched from tckdb-client 0.46.0 on 2026-08-16, both
      #   correctly bumped to 0.47.0, and git merged the byte-identical
      #   version line with no conflict and no entry in the merge stat. One
      #   number, two packages. The same thing has already happened five
      #   times to tckdb-schemas -- run the script with --audit to see them.
      #
      #   It lives in the unfiltered workflow because the packages it covers
      #   include integrations/mcp, which python-client-ci.yml's paths:
      #   filter does not match: a pull request touching only that package
      #   would start no job that could notice. The guard's own tests run
      #   here too, for the reason given above about the aggregator -- a
      #   defect in a guard is a defect in the gate.
      - name: The guard against two packages claiming one version works
        run: python -m pytest --noconftest -q backend/tests/scripts/test_check_package_version_bump.py

      # THE TWO REFS ARE DIFFERENT ON PURPOSE.
      #
      #   --base-ref is the base branch's tip *as the pull request event saw
      #   it*, a concrete sha that always exists in the checkout. The script
      #   takes merge-base(base, head) from it, which is the only ref that
      #   asks the author the question they can answer: "did you raise the
      #   number from where you branched?" Comparing against the current tip
      #   instead would fail a branch that is merely behind, blaming it for
      #   someone else's merge.
      #
      #   --main-ref is the base branch as fetched *now*, which is fresher
      #   than base.sha and therefore includes a sibling branch that merged
      #   after this pull request last ran. That is the whole point: the
      #   colliding version is never on the merge base's history -- it
      #   arrives on main after the branch point, which is what makes the
      #   collision possible.
      #
      # RESIDUAL GAP, STATED RATHER THAN HIDDEN
      #   If this job last ran before the sibling merged and is never re-run,
      #   its green is stale. No CI check can close that from inside the run;
      #   it needs "Require branches to be up to date before merging" in
      #   branch protection. The guard narrows the window to the interval
      #   between the last run and the merge, instead of leaving it open.
      - name: A changed package carries an unused, strictly greater version
        run: >-
          python backend/scripts/check_package_version_bump.py
          --base-ref "${{ github.event.pull_request.base.sha || github.sha }}"
          --head-ref "${{ github.event.pull_request.head.sha || github.sha }}"
          --main-ref "origin/${{ github.base_ref || github.event.repository.default_branch }}"

      # Runs here too, and not only in the backend complement gate, because
      # this file is the mechanism by which the *other* workflows become
      # requireable. A defect in it is a defect in the gate that reports
      # them, and the complement gate is one of the things it reports on --
      # so a change that breaks the aggregator must not depend on the
      # aggregator's own subject running to be noticed.
      - name: The aggregate gate can still tell the three states apart
        run: python -m pytest --noconftest -q backend/tests/scripts/test_aggregate_pr_gates.py

      # The deployment monitor's own shell, exercised. It belongs in THIS
      # workflow rather than a path-filtered one for the same reason the
      # coverage guard does: uptime-check.yml is the only thing watching the
      # deployment from outside it, and a monitor that has silently stopped
      # monitoring is indistinguishable from a healthy system. It needs bash,
      # curl and jq -- all present on ubuntu-latest -- and binds only to
      # loopback.
      - name: The uptime probe still tells its three verdicts apart
        run: python -m pytest --noconftest -q backend/tests/scripts/test_uptime_check_heartbeat.py

  required-gates:
    # THE REQUIRED CHECK. This job's name is the context listed in branch
    # protection, so renaming it silently un-requires every test suite in
    # the repository -- test_required_gates_job_is_named_and_unconditional
    # in backend/tests/scripts/test_gate_coverage.py pins the name.
    #
    # It deliberately has no `needs:` and no `if:`. A job that GitHub skips
    # reports the conclusion "skipped", which branch protection accepts as
    # satisfying a required check -- so any condition here is a way for the
    # gate to pass without running. The one event test lives inside the
    # script, where it is a code path with a test rather than an
    # expression nothing evaluates.
    name: Required gates
    runs-on: ubuntu-latest
    # The backend gates cap at 90 minutes each; the script gives up at 95
    # and reports failure, so this outer cap only fires if the script
    # itself wedges -- in which case GitHub fails the job, which is the
    # direction we want.
    timeout-minutes: 100

    permissions:
      contents: read
      # Read the conclusions of the path-filtered workflow runs.
      actions: read
      # Read the pull request's changed-file list, which is what decides
      # whether an absent run is legitimate.
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install check dependencies
        run: python -m pip install "PyYAML>=6"

      - name: Report the path-filtered gates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python backend/scripts/aggregate_pr_gates.py
          --repo "${{ github.repository }}"
          --pr-number "${{ github.event.pull_request.number || 0 }}"
          --head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --run-id "${{ github.run_id }}"
          --event-name "${{ github.event_name }}"
