name: uptime-check

# The dead man's switch for the deployed instance.
#
# WHY THIS EXISTS SEPARATELY FROM THE PI-SIDE CHECKER
#   backend/scripts/ops/tckdb_alert_check.sh runs ON the Pi, so it reports
#   component failures (worker thread dead, database unreachable, schema not
#   migrated) but cannot report the Pi itself dying -- it dies too, and silence
#   is indistinguishable from health. Alerting must not share a failure domain
#   with the thing it watches. This job runs on GitHub's infrastructure, which
#   is about as independent from a Raspberry Pi as it gets, and it needs no
#   third-party monitoring account.
#
# NOISE BEHAVIOUR, DELIBERATE
#   The Pi-side checker notifies only on state *change*. This one notifies on
#   every failed run, because a job on hosted CI has nowhere reliable to keep
#   state between runs, and because a total outage genuinely should keep
#   nagging. Expect a push roughly every 15 minutes until the site is back.
#
# SCHEDULING CAVEAT
#   GitHub's cron is best-effort: runs can be delayed several minutes under
#   load and are occasionally skipped. This is fine for "is it alive" and is
#   not a latency SLA. Note also that GitHub disables scheduled workflows in
#   repositories with no activity for 60 days.
#
# THE POSITIVE SIGNAL, AND WHY IT IS A SEPARATE MECHANISM
#   Everything above is negative: it speaks when something is wrong. Nothing in
#   it lets an operator confirm the deployment is *well* without curling
#   /status by hand, and "no alert" is not the same statement as "I checked and
#   it is fine" -- an alerter that has silently stopped produces identical
#   silence. So this job also pings an external heartbeat check
#   (healthchecks.io), which turns the same run into a signal an operator can
#   look at: last ping, and up/down, on a page that is not hosted on the Pi.
#
#   Two outcomes:
#
#     status ok, nothing degraded -> ping success. The check shows "up".
#     anything else               -> ping /fail, including "no answer at all".
#
#   AN EARLIER VERSION SENT NOTHING WHEN THE DEPLOYMENT DID NOT ANSWER, on the
#   reasoning that a runner with broken egress cannot tell a dead host from its
#   own dead network, so a /fail there would report an outage on no evidence.
#   That reasoning is wrong, for a reason worth writing down because it is not
#   obvious: THE /fail PING TRAVELS THE SAME EGRESS. A runner that cannot reach
#   the deployment because its own networking is broken cannot reach
#   healthchecks.io either, so the ping fails to deliver and the check goes
#   quiet anyway. The case being guarded against produces the desired behaviour
#   by itself, and the guard bought nothing but a delay.
#
#   Delivering the /fail is therefore also evidence: it proves this runner's
#   egress works, which means the deployment really is the thing that cannot be
#   reached. And unreachable IS down -- a database nobody can get to is not
#   serving anyone, whatever its process table says.
#
#   The decisive argument is coherence. This job already sends an urgent ntfy
#   push the moment it cannot reach the deployment. Staying silent to the
#   heartbeat left the dashboard green for up to a full period plus grace after
#   that push went out, so the two signals contradicted each other and the one
#   an operator would open to confirm the alarm was the one still saying
#   "fine". Two monitors disagreeing is worse than either alone.
#
#   The heartbeat is supplementary. If its secret is unset, or healthchecks.io
#   is unreachable, this job's ntfy alerting is untouched.
#
# WARNINGS, WHICH MUST NOT PAGE AND MUST NOT REDDEN THE RUN
#   /status carries two verdict fields. `degraded` lists components that are
#   BROKEN; this job pushes urgent and exits 1 on it, every fifteen minutes
#   until it clears. `warnings` lists things that are TRUE BUT NOT YET BROKEN
#   -- today, an object store whose remaining room has fallen below the
#   largest artifact TCKDB accepts.
#
#   A warning is pushed at Priority: low, the heartbeat still reports SUCCESS,
#   and the job still exits 0. Routing it any other way would page an operator
#   about a deployment where every upload works, turn the dashboard red on the
#   same evidence, and -- because this job repeats every fifteen minutes with
#   no state between runs -- do both again four times an hour until somebody
#   silenced the channel. A muted channel is worse than no warning, because it
#   takes the outage alerts down with it.
#
# SETUP
#   gh secret set TCKDB_NTFY_TOPIC --repo TCKDB/TCKDB
#   (the same topic the Pi-side checker publishes to, so both classes of alarm
#   land in one place)
#
#   gh secret set TCKDB_DEPLOYMENT_HEARTBEAT_URL --repo TCKDB/TCKDB
#   (a healthchecks.io ping URL, period ~20 min and grace ~10 to absorb
#   GitHub's best-effort cron. A DIFFERENT check from the one behind
#   TCKDB_DEADMAN_URL, which belongs to ci-watchdog.yml and watches CI, not the
#   deployment. The URL is the whole credential -- anyone holding it can forge
#   this heartbeat and keep the alarm quiet -- so it is a secret, read into the
#   environment, and never interpolated into a command line.)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Never run two checks at once; a backed-up queue would alert on stale state.
concurrency:
  group: uptime-check
  cancel-in-progress: true

jobs:
  probe:
    if: github.repository == 'TCKDB/TCKDB'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Probe the deployment and alert on failure
        env:
          # Read into the environment rather than interpolated into a command,
          # so the topic never appears in a rendered command line. This
          # repository is public; GitHub masks secret values in logs, but the
          # safe habit is not to put them anywhere that gets echoed.
          NTFY_TOPIC: ${{ secrets.TCKDB_NTFY_TOPIC }}
          HEARTBEAT_URL: ${{ secrets.TCKDB_DEPLOYMENT_HEARTBEAT_URL }}
          STATUS_URL: https://tckdb.homecalvin.com/api/v1/status
          # Overridable so the shell below can be executed against a local
          # stand-in and the pushes it sends can be asserted on. The Pi-side
          # checker has always had TCKDB_NTFY_SERVER for the same reason; this
          # job hard-coded ntfy.sh, which meant no test could see whether it
          # published at all, let alone at what priority.
          NTFY_SERVER: https://ntfy.sh
        run: |
          set -uo pipefail

          if [ -z "${NTFY_TOPIC}" ]; then
            echo "::warning::TCKDB_NTFY_TOPIC is not set; probing without alerting."
          fi
          if [ -z "${HEARTBEAT_URL:-}" ]; then
            echo "::warning::TCKDB_DEPLOYMENT_HEARTBEAT_URL is not set; there is no positive signal that the deployment is well, only alerts when it is not."
          fi

          # heartbeat <suffix> -- "" to report success, "/fail" to report a
          # failure the check should show immediately. Never fails the job: a
          # heartbeat that cannot be delivered must not turn a healthy
          # deployment into a red workflow run, and its absence is itself the
          # signal healthchecks.io alerts on.
          heartbeat() {
            if [ -z "${HEARTBEAT_URL:-}" ]; then
              return 0
            fi
            # %/ strips one trailing slash so "<url>/" + "/fail" cannot become
            # a double slash, which healthchecks.io does not route.
            curl -sS --fail --max-time 20 -o /dev/null "${HEARTBEAT_URL%/}${1}" \
              || echo "::warning::failed to ping the deployment heartbeat"
          }

          # notify <title> <priority> <tags> <body>. --fail because here an
          # HTTP error IS the answer: a 401 from a protected topic or a 5xx
          # from ntfy means the push reached nobody, and without it curl exits
          # 0 and this job logs a delivered alert that was never delivered.
          # The same bug was fixed in the Pi-side checker; it lived on here.
          notify() {
            if [ -z "${NTFY_TOPIC}" ]; then
              return 0
            fi
            curl -sS --fail --max-time 25 \
              -H "Title: $1" \
              -H "Priority: $2" \
              -H "Tags: $3" \
              -d "$4" \
              "${NTFY_SERVER:-https://ntfy.sh}/${NTFY_TOPIC}" >/dev/null \
              || echo "::warning::failed to publish to ntfy"
          }

          # Set on the 200 path only; declared here because `set -u` is on and
          # the unreachable and non-200 paths never reach the parser. Empty
          # means "no warnings", which is also the right answer for a build
          # too old to carry the field.
          warnings=""

          raw="$(curl -sS --max-time 25 -w '\n%{http_code}' "$STATUS_URL" 2>/dev/null)"
          rc=$?
          code="$(tail -n1 <<<"$raw")"
          body="$(sed '$d' <<<"$raw")"

          if [ $rc -ne 0 ] || [ -z "$body" ]; then
            summary="TCKDB is unreachable from GitHub (curl exit ${rc})."
            detail="No response from the public status endpoint. The host may be down, off the network, or the tunnel/proxy may be broken. The on-host checker cannot tell you this, which is why this job exists."
          elif [ "$code" != "200" ]; then
            summary="TCKDB status endpoint returned HTTP ${code}."
            detail="The deployment answered but could not report its own health. A 404 usually means a build without /status; a 5xx means the API is failing before it can respond."
          else
            state="$(jq -r '.status // "unparseable"' <<<"$body")"
            degraded="$(jq -r '(.degraded // []) | join(", ")' <<<"$body")"
            reasons="$(jq -r '[.components // {} | to_entries[] | select(.value.healthy == false) | "\(.key): \(.value.reason // "unhealthy")"] | join("; ")' <<<"$body")"
            warnings="$(jq -r '[.warnings // [] | .[] | .summary // .code // "unspecified warning"] | join(" | ")' <<<"$body")"

            # Both fields decide. They derive from the same set of unhealthy
            # components today, so reading only `status` works today -- and
            # would keep "working", silently, the moment that stops being
            # true. A monitor that passes on a summary field while the
            # components below it say otherwise is the exact failure mode
            # this deployment has already had once.
            if [ "$state" = "ok" ] && [ -z "$degraded" ]; then
              echo "TCKDB ok"
              # A warning rides out on this path, not the failure path below.
              # ::notice:: rather than ::error:: so the run stays green, and
              # Priority: low so the push lands without a siren. Deliberately
              # BEFORE the heartbeat and the exit, so a failure to publish
              # cannot change either.
              if [ -n "$warnings" ]; then
                echo "::notice::TCKDB warning: ${warnings}"
                notify "TCKDB warning" "low" "warning" \
                  "$(printf '%s\n\nNothing is broken and every upload still works; this is the notice that arrives before one stops working. Checked from GitHub Actions.' "$warnings")"
              fi
              # The only place a success ping is sent, and it is sent on the
              # same condition the job exits 0 on -- so the heartbeat page and
              # this workflow's own verdict cannot disagree. A warning does
              # not touch it: the deployment is well, and saying otherwise
              # would make the dashboard disagree with the exit code.
              heartbeat ""
              exit 0
            fi

            if [ "$state" = "ok" ]; then
              summary="TCKDB reports status=ok while listing degraded components (${degraded})."
              detail="The endpoint is contradicting itself. Treat the components as authoritative: ${reasons:-no reason reported}"
            else
              summary="TCKDB is degraded (${degraded:-unknown})."
              detail="${reasons:-no reason reported}"
            fi
          fi

          echo "::error::${summary}"

          message="$(printf '%s\n\nChecked from GitHub Actions, which runs independently of the deployment host. Repeats every ~15 minutes until resolved.' "$detail")"
          notify "${summary}" "urgent" "rotating_light" "$message"

          # Every failure, including "it did not answer", so the heartbeat page
          # agrees with the push that has just gone out. Self-limiting: if this
          # runner's own networking is what is broken, this ping cannot be
          # delivered either, the warning above fires, and the check falls
          # silent on its own -- which is the behaviour an explicit guard here
          # would have produced, at the cost of delaying every real outage.
          heartbeat "/fail"

          exit 1
