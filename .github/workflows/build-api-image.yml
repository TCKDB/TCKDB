name: build-api-image

# Build the TCKDB API container and push it to Docker Hub
# (docker.io/<DOCKERHUB_USERNAME>/tckdb-api) on every push to main that touches
# the backend, plus on manual dispatch. Credentials come from the repo secrets
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token, never a
# password). This is the "build + publish" half of CI/CD; the "deploy" half
# (a host pulling the new image, restarting, and running migrations) is
# described in docs/deployment/self_hosting.md and is intentionally NOT
# automated here — it needs a per-deployment decision (webhook / Watchtower /
# scheduled pull) and DB-migration handling.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'schemas/python/**'
      - '.github/workflows/build-api-image.yml'
    # A release tag builds an image named after the release. `sha-<commit>` is
    # already immutable and is what a deploy should pin to, but it is not what
    # a paper or a citation can reasonably quote; `v1.2.3` is.
    tags:
      - 'v*'
  workflow_dispatch:


# One image, two native builds. amd64 builds on an amd64 runner and arm64 on
# GitHub's free native arm64 runner (public repos only), then a merge job
# stitches the two by-digest images into one multi-arch manifest list. No step
# runs under QEMU: the emulated arm64 `micromamba install` hung intermittently
# (log stops at "Transaction starting"), blocking the deploy. This is the
# pattern documented at
# https://docs.docker.com/build/ci/github-actions/multi-platform/

env:
  REGISTRY_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tckdb-api

jobs:
  build:
    if: github.repository == 'TCKDB/TCKDB'
    name: build (${{ matrix.platform }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          # Docker Hub is the default registry; log in with the repo secrets.
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Labels only. Tags are computed once, in the merge job, because the
      # per-platform images are pushed by digest and carry no tag. The
      # tags: block is repeated here only so the labels (notably
      # org.opencontainers.image.version) match the merge job's.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            # Mutable pointer at the newest main build. Convenient for a
            # scratch pull; never pin a deployment to it -- it moves.
            type=raw,value=latest,enable={{is_default_branch}}
            # Immutable, one per commit. This is what a deployment pins to and
            # what makes "which code is running" answerable.
            type=sha,format=long
            # Immutable, human-meaningful, cut from a `v*` git tag. This is the
            # one a paper cites, and the one stage 5's "Pi is reproducible from
            # tagged release" means.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build this leg's native arch and load it locally so it can be RUN
      # before anything is published. `docker build` succeeding only proves the
      # layers assembled -- not that Python can import the app, that RDKit's
      # shared libraries resolve, or that uvicorn binds. The Dockerfile has
      # carried "STATUS: scaffold, must be validated by an actual build" since
      # it was written; publishing an image nobody has run is how that stays
      # true. Each platform has its own gha cache scope so the two legs never
      # evict each other's conda layers. This must be the build-push-action:
      # a plain `run:` step has no Actions runtime token, so gha cache flags
      # there are silently dropped.
      - name: Build image for smoke testing
        timeout-minutes: 45
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: tckdb-api:smoketest
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.arch }}

      - name: Smoke test — the image must import and serve
        if: matrix.platform == 'linux/amd64'
        timeout-minutes: 20
        env:
          PGPASSWORD: tckdb
        run: |
          set -euo pipefail

          # A throwaway database on a user-defined network, addressed by
          # container name. No host ports are published for it: binding 5432 on
          # the host makes this collide with anything else already listening,
          # which is exactly how it failed when first rehearsed locally against
          # a developer machine running its own Postgres.
          #
          # The RDKit cartridge image, not stock postgres: the first migration
          # issues `CREATE EXTENSION IF NOT EXISTS rdkit`, so a stock image
          # fails at "Could not open extension control file rdkit.control".
          # Serving needs no cartridge types; migrating does. Same image and
          # tag as docker-compose.yml, so this tests the real pairing.
          docker network create smoke-net
          # The encoding pin matters more here than anywhere: this is the last
          # check before an image is published, so a smoke DB on SQL_ASCII
          # would clear an image against a cluster that accepts bytes the
          # deployed UTF8 database rejects -- passing for the wrong reason.
          # POSTGRES_INITDB_ARGS applies only at initdb, never retroactively.
          docker run -d --name smoke-db --network smoke-net \
            -e POSTGRES_USER=tckdb -e POSTGRES_PASSWORD=tckdb \
            -e POSTGRES_DB=tckdb_smoke \
            -e LANG=C.UTF-8 \
            -e POSTGRES_INITDB_ARGS=--encoding=UTF8 \
            informaticsmatters/rdkit-cartridge-debian:Release_2025_03_3

          # pg_isready runs INSIDE the container, so this does not depend on
          # the runner having postgresql-client installed.
          for _ in $(seq 1 30); do
            docker exec smoke-db pg_isready -U tckdb >/dev/null 2>&1 && break
            sleep 2
          done

          # 1. Does the app import at all? This is where a missing runtime
          #    dependency shows up, and the Dockerfile says to fix those in
          #    backend/environment.yml rather than with a pip line.
          docker run --rm tckdb-api:smoketest \
            python -c "import rdkit, tckdb_schemas; from app.api.app import create_app; print('imports ok', rdkit.__version__)"

          # 2. Can it migrate a fresh database? This is how the image is
          #    actually deployed, so an image that serves but cannot bring a
          #    schema up is not deployable. It also proves alembic and every
          #    migration import cleanly inside the container.
          docker run --rm --network smoke-net \
            -e DB_USER=tckdb -e DB_PASSWORD=tckdb -e DB_NAME=tckdb_smoke \
            -e DB_HOST=smoke-db -e DB_PORT=5432 \
            tckdb-api:smoketest alembic upgrade head

          # 3. Does it serve? A container that imports but cannot answer
          #    /health is still broken. Only the API port is published, on a
          #    high number to stay clear of anything else.
          docker run -d --name smoke-api --network smoke-net -p 18010:8010 \
            -e DB_USER=tckdb -e DB_PASSWORD=tckdb -e DB_NAME=tckdb_smoke \
            -e DB_HOST=smoke-db -e DB_PORT=5432 \
            -e TCKDB_INLINE_WORKER=true \
            tckdb-api:smoketest

          code=000
          for _ in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18010/api/v1/health || true)
            [ "$code" = "200" ] && break || sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "::error::image did not serve /health (last code: $code)"
            docker logs smoke-api 2>&1 | tail -50
            exit 1
          fi

          # 4. Does it report its own health, and did the inline worker thread
          #    actually start inside the container? That is the signal the
          #    deployment's alerting relies on, so an image where it never
          #    starts is broken in a way /health cannot see.
          status="$(curl -s http://127.0.0.1:18010/api/v1/status)"
          echo "$status"
          echo "$status" | grep -q '"thread_alive":true' || {
            echo "::error::inline worker thread did not start in the container"
            docker logs smoke-api 2>&1 | tail -50
            exit 1
          }
          # Every component this environment actually provides must be healthy.
          #
          # Deliberately NOT `status == ok`. This harness starts a database and
          # nothing else, so `/status` correctly reports `artifact_storage` as
          # degraded -- there is no object store to reach. Asserting overall ok
          # would make the smoke test demand a dependency it never supplies,
          # which is how it broke when artifact storage was added as a
          # component. Asserting only on the worker would let a broken database
          # pass unnoticed, so both are checked directly, and `degraded` is
          # pinned to exactly the one component this harness omits -- anything
          # else appearing there is a real regression.
          echo "$status" | grep -q '"database":{"healthy":true' || {
            echo "::error::image reported an unhealthy database after migrating"
            docker logs smoke-api 2>&1 | tail -50
            exit 1
          }
          degraded="$(echo "$status" | sed -n 's/.*"degraded":\[\([^]]*\)\].*/\1/p')"
          if [ "$degraded" != '"artifact_storage"' ] && [ -n "$degraded" ]; then
            echo "::error::unexpected degraded components: ${degraded}"
            docker logs smoke-api 2>&1 | tail -50
            exit 1
          fi

          docker rm -f smoke-api smoke-db >/dev/null
          docker network rm smoke-net >/dev/null

      # The import check runs on BOTH legs, natively. arm64 is the deployment
      # target (Raspberry Pi); this catches what differs between architectures:
      # a dependency with no arm64 build, or a shared library that fails to
      # load. The full serve test above runs on amd64 only for now; enabling it
      # on arm64 is a one-line change (drop the `if`) once a main run shows it
      # is clean there.
      - name: Smoke test — imports on ${{ matrix.platform }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          docker run --rm tckdb-api:smoketest \
            python -c "import rdkit, tckdb_schemas; from app.api.app import create_app; print('${{ matrix.arch }} imports ok', rdkit.__version__)"

      # Push this platform's image by digest only (no tag). Layers come from
      # the gha cache populated by the smoke build, so this is fast.
      - name: Push by digest
        id: push
        timeout-minutes: 45
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.repository == 'TCKDB/TCKDB'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same images: and tags: block as before the split, so every tag
      # (latest, sha-<full sha>, semver) is unchanged. The Pi deploy pulls
      # sha-<full commit sha>.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            # Mutable pointer at the newest main build. Convenient for a
            # scratch pull; never pin a deployment to it -- it moves.
            type=raw,value=latest,enable={{is_default_branch}}
            # Immutable, one per commit. This is what a deployment pins to and
            # what makes "which code is running" answerable.
            type=sha,format=long
            # Immutable, human-meaningful, cut from a `v*` git tag. This is the
            # one a paper cites, and the one stage 5's "Pi is reproducible from
            # tagged release" means.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          # Both platforms must be present: a merge of one is a silent
          # single-arch publish, which the Pi (arm64) could not pull.
          [ "$(ls | wc -l)" = "2" ] || { echo "::error::expected 2 digests, got: $(ls)"; exit 1; }
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect manifest list
        env:
          IMAGE_REF: ${{ env.REGISTRY_IMAGE }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          out="$(docker buildx imagetools inspect "$IMAGE_REF")"
          echo "$out"
          for platform in linux/amd64 linux/arm64; do
            echo "$out" | grep -Eq "^ *Platform: +${platform}$" || {
              echo "::error::manifest list is missing ${platform}"
              exit 1
            }
          done
