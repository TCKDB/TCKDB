name: Frontend CI

on:
  pull_request:
    paths:
      - ".github/workflows/frontend-ci.yml"
      - "frontend/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/frontend-ci.yml"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-gate:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
