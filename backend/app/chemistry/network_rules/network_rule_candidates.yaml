# Candidate pressure-dependent network preference rules, audit manifest version 0.1.0 (2026-10-04).
#
# NOTHING HERE IS ACTIVE. Every entry has activation_approved: false, no curator acceptance and a list of
# blockers, and the registry (app.services.network_selection.rules) loads this file only against its pinned
# SHA-256 and registers each entry INACTIVE. An agent never activates a rule: activation needs the owner's signed
# acceptance in this file AND the rule's predicates to be implemented and reviewed, and neither exists. A change to
# an entry, a blocker or a source list is a new manifest version, a new pin and a new rule version, never an
# in-place edit.
#
# Provenance of what follows. These are the council examples of the Network-v1 proposal (council rationale of
# 2026-10-04, section 3). The Amedro entry was audited against the open-access article and its supplement, both
# pinned below by SHA-256 (the two numbers it quotes are anchored to page and figure). Johnson/Green was seen only
# through indexed passages and Jasper/Miller at abstract level; neither full text was read here, and each entry
# says so. No paywalled paper was downloaded, and no table was extracted or fit reconstructed. Each entry says what
# is missing, and `evidence_needed` lists exactly which paper, table or data would have to be supplied or
# authorised before any of them could be considered.
manifest_version: 0.1.0
manifest_date: '2026-10-04'
audit_status: inactive_registered_with_missing_prerequisites
sources:
- id: AMEDRO_2020
