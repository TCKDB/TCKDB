  license: CC BY 4.0
  open_access: true
  read_from: https://acp.copernicus.org/articles/20/3091/2020/ (the article PDF)
  sha256: 8c4e305bddfe5631c54d1c3685dc2ee3351b0e68677abd70be5e0c08dd45288f
  accessed: '2026-10-04'
  used_for: "Section 3.1 (p. 3095): best He fit Fc = 0.32 with k0He = 1.4e-30 cm6 molecule-2 s-1 (kinf fixed at 6.3e-11, n = 0), and the Fc = 0.39 comparison (about 5 % high above about 300 Torr, about 10 % low below); Fig. 1 caption (p. 3094); Table 1, 'Measurements of k1 in He bath gas' (p. 3092), located but NOT extracted; Data availability statement (Table 1 is the dataset)"
- id: AMEDRO_2020_SUPPLEMENT
