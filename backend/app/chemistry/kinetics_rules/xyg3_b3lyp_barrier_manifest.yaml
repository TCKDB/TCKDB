# XYG3 vs B3LYP classical-barrier audit manifest, version 0.2.0 (2026-10-04). NOT approved for activation:
# status.activation_approved is false and status.activation_blockers says why. Compiled from the five
# owner-supplied papers listed under sources (SHA-256 pinned there) and copied here unchanged except for this
# header. Loaded by app.chemistry.kinetics_rules.xyg3_barrier_manifest. A change to a member, a barrier
# height or a blocker is a new manifest version and a new rule version, never an in-place edit.
rule_id: K-XYG3-B3LYP-BARRIER
rule_statement: For a computed rate coefficient whose classical electronic barrier is evaluated with XYG3, an expected-performance
  preference over the same barrier evaluated with B3LYP, restricted to the 38 reactions (76 barrier heights) of the HTBH38/04
  and NHTBH38/04 benchmark sets, and only where the remaining treatment of the two rates is verified compatible. An expected-performance
  inference, not a validated accuracy of any individual rate.
manifest_version: 0.2.0
manifest_date: '2026-10-04'
manifest_history:
- version: 0.1.0
  date: '2026-10-04'
  note: Membership read in full from the supplied PDFs; rule NOT activated (see status.activation_blockers).
- version: 0.2.0
  date: '2026-10-04'
  note: NHT08 and NHT10 degenerate_identity_reaction corrected from false to true (their reactant and product species are
    identical, the same as NHT09's); no number, member or blocker changed. Rule NOT activated.
status:
  membership_listed_complete: true
  membership_listing_sources:
  - ZHAO_2005_SI Table S1 (HTBH38/04, 19 reactions)
  - ZHAO_2005 Table 2 (NHTBH38/04, 19 reactions)
  count_stated_by_source:
    reactions: 38
    barrier_heights: 76
    HT38: 38
    HAT12: 12
    NS16: 16
    UM10: 10
  count_found:
    reactions: 38
    barrier_heights: 76
  identity_unresolved: 0
  members_with_a_complex_identity_caveat: 4
  activation_approved: false
  activation_recommendation: 'Do not activate. Membership is complete by listing, but the evidence cannot establish the comparison
    the rule would need: see activation_blockers. Activation also needs explicit owner or curator sign-off, which has not
    been given.'
  curator_acceptance: null
  activation_blockers:
  - id: comparator_protocol_unverified
    text: Zhang 2009 Table 2 marks B3LYP (4.28 / 4.23 / 8.49 / 3.25 / 2.02) as the authors' own 6-311+G(3df,2p) calculation,
      but all five numbers are identical to the B3LYP/MG3S values Zhao-Gonzalez-Garcia-Truhlar printed in 2005 (jp045141s
      Tables 4 and 5, including the uncorrected 4.28 total). A recomputation in another basis would not reproduce five columns
      to 0.01 kcal/mol. The paper therefore does not establish an XYG3 versus B3LYP comparison in one basis set.
  - id: only_aggregate_evidence
    text: Zhang 2009 and its SI give subset mean unsigned errors only. The SI holds heats of formation (Table S1) and no per-reaction
      XYG3 barrier heights, so no member-by-member advantage can be checked; the rule would extend subset-level evidence to
      each listed member.
  - id: reference_geometry_not_expressible
    text: Every benchmark energy is a single point at the Truhlar QCISD/MG3 reference geometry. A TCKDB protocol declaration
      can say the geometry was optimized at another level, but not which; it cannot show a record used the benchmark geometry.
  - id: electronic_method_not_a_protocol_field
    text: The protocol declaration has no electronic method or basis. XYG3 and B3LYP could only be read from linked or supporting
      calculations, and a source-calculation link does not establish that its energy was used.
  - id: correction_changes_a_cited_total
    text: 'The 2006 correction (jp061040d) changes the printed totals: B3LYP non-HT(38) 4.34 -> 4.58 and all(76) 4.28 -> 4.40.
      Zhang 2009 prints the uncorrected 4.28, so the paper''s all-76 gap to B3LYP is 3.26 as printed and 3.38 corrected. Subset
      columns are unaffected.'
