  effect_on_this_rule: Zhang 2009 Table 2 prints B3LYP all-76 as 4.28, the uncorrected value; HAT12, NS16, UM10 and HT38 columns
    are unchanged
protocol_facts:
  barrier_quantity: classical (electronic, no zero-point energy) forward and reverse barrier heights at the saddle point,
    relative to the reactants (or reactant complex) of the direction named
  barrier_quantity_evidence:
  - 'ZHAO_2005 section 2.1: the experimental route is rejected for the ''difficulty of inverting the experimental data to
    obtain a classical BH'''
  - 'ZHAO_2005 Table 1: W1 components are SCF limit, CCSD limit, (T) limit, core correlation and relativistic, spin-orbit;
    there is no zero-point term'
  - 'ZHANG_2009 Table 2 footnote: geometries and reference energies taken from the Truhlar database; no frequency calculation
    is involved'
  scaled_zpe_factor_0_9877: 'applies only to the heats-of-formation calculations (ZHANG_2009 Table 1: B3LYP/6-311+G(d,p) frequencies
    scaled by 0.9877); it is not part of the barrier-height comparison'
  directions: each reaction contributes a forward and a reverse barrier height relative to its listed orientation; HT38 =
    19 x 2, HAT12 = 6 x 2, NS16 = 8 x 2, UM10 = 5 x 2
  reference_geometry: QCISD/MG3, from the Truhlar group database website, for every method
  xyg3:
    basis: 6-311+G(3df,2p)
    orbitals_and_density: self-consistent B3LYP
    parameters:
      c1: 0.8033
      c2: 0.2107
      c3: 0.3211
    training_set: G3/99 heats of formation only (223 molecules); barrier heights and noncovalent interactions are not in the
      training set (ZHANG_2009 p. 4966)
  b3lyp:
    basis_as_footnoted_by_zhang: 6-311+G(3df,2p) (own calculation, footnote *)
    basis_in_the_identical_published_numbers: MG3S at QCISD/MG3 geometries (jp045141s section 2.6; SI Tables S2-S5 footnote
      b)
    training: parametrized only against thermochemistry (jp045141s introduction), so barrier heights are out of sample
  out_of_sample: barrier heights are out of sample for both XYG3 and B3LYP; they were in the M06 training set
