reproduction_checks:
- claim: B3LYP NS16 MUE 3.25 and UM10 MUE 2.02 (jp045141s Table 4)
  result: 'reproduced exactly from SI Table S3 and Table 2: 3.25 and 2.02 (UM10 MSE -1.42)'
- claim: B3LYP HAT12 MUE 8.49 (jp045141s Table 4)
  result: 'not reproduced exactly: the SI and Table 2 values I read give 8.42 (a total of 0.88 kcal/mol over 12 barrier heights).
    Unresolved; it does not change any conclusion'
- claim: B3LYP non-HT(38) total, printed 4.34 and corrected 4.58
  result: 36 barrier heights (CH3 + FCl omitted) give 4.34, matching the printed total; 38 give 4.56, matching the correction
    to 0.02
evidence_limits:
- id: aggregate_not_per_member
  text: Mean unsigned errors over a subset do not say XYG3 beats B3LYP for any particular reaction.
- id: single_geometry
  text: All energies are single points at QCISD/MG3 geometries; performance with other geometries is not tested.
- id: classical_barrier_only
  text: The evidence concerns classical electronic barriers; it does not cover zero-point-corrected barriers, tunneling, partition
    functions, anharmonicity or fit quality.
- id: complex_identity
  text: Four nucleophilic-substitution members (eight barrier heights) are between ion-molecule complexes. A complex is matched
    by the InChIKey of its disconnected structure and a vdw_complex entry kind; that key does not say which fragment carries
    the ion (F-...CH3F and FCH3...F- share one), so those members match by identity only.
- id: main_group_only
  text: Main-group, closed- and open-shell species of the listed reactions only; the paper notes XYG3 can break the variational
    principle with near-degeneracy, for example transition metals.
- id: not_a_rate_accuracy
  text: A better classical barrier is not a better rate; the rule is an expected-performance inference.
