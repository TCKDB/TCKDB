  activation_approved: true
  activation_recommendation: >-
    Count-complete (38/38) but NOT complete-by-listing. The 16 G3/99 additions are now
    named in the G3/99 paper (Table I) with the category count stated in its text, and
    row-order assignment is confirmed by reproducing three published MADs. Still inferred:
