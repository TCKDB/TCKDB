scope_conditions:
  charge: 0
  phase: gas
  property: "standard enthalpy of formation at 298.15 K (benchmark: 298 K)"
  derivation: "atomization route per G2/97 Eqs. (1)-(2); see recipe_facts.formation_enthalpy"
  excluded_by_construction:
    - "radicals (incl. CH, CH2(3B1), CH3, CCH, C2H3, C2H5, (CH3)2CH, (CH3)3C, C6H5) - G3/05 'Radicals (34)' subset, not 'Hydrocarbons (38)'"
    - "H2 - G2/97 'Inorganic hydrides' (Table II heading)"
    - "any species not in this list (no 'small hydrocarbon' predicate)"
statistics_check:
  description: "Recomputed from per-species G4 deviations (ANL/EPAPS Table 11) over the 38 members"
  g4_mad_recomputed: 0.484
  g4_rms_recomputed: 0.703
  g4_mad_published: 0.48
  g4_rms_published: 0.70
  caveat: "Consistent, but NOT uniquely discriminating: many single-species swaps also round to 0.48/0.70. Membership rests on the count reconciliation, not on this check."
recipe_facts:
  standard_G4:
    source: G4_2007
    geometry: "B3LYP/6-31G(2df,p); RHF/RB3LYP for singlets, unrestricted for others (step 1)"
    zpe: "B3LYP/6-31G(2df,p) harmonic frequencies scaled by 0.9854 (step 2)"
    hf_limit: "two-point extrapolation E(HF/n)=E(HF/limit)+B exp(-alpha n), n=4,5 (G4-modified aug-cc-pVQZ / aug-cc-pV5Z), alpha=1.63 (step 3)"
    single_points: "MP4/6-31G(d) + dE(+) [MP4/6-31+G(d)] + dE(2df,p) [MP4/6-31G(2df,p)] + dE(CC) [CCSD(T)/6-31G(d)] + dE(G3LargeXP) [MP2(full)/G3LargeXP - MP2/6-31G(2df,p) - MP2/6-31+G(d) + MP2/6-31G(d)] + dE(HF) + dE(SO) (Eq. 6); MP4 and CCSD(T) frozen core, large-basis MP2 all-electron"
    spin_orbit: "atoms only (Table I), plus first-order 2Pi diatomics. For hydrocarbons only the atomic C(3P) -0.14 mEh term applies."
    hlc_mhartree: {A: 6.947, B: 2.441, C: 7.116, D: 1.414, A_prime: 7.128, E: 2.745}
    hlc_form: "-A n_beta (closed-shell molecules); -A' n_beta - B(n_alpha-n_beta) (open-shell); -C n_beta - D(n_alpha-n_beta) (atoms); E for species whose valence shell is a single s pair (not relevant to hydrocarbons)"
    hlc_fit_set: "A,A',B,C,D fitted to minimise MAD over the whole G3/05 test set; E fitted to 13 single-pair species (text, p. 084108-3/-4). NOTE Table III caption says the HLC was 'reoptimized using the G3/99 test set' for the stepwise variants - internal inconsistency in the paper."
    final: "E0(G4) = E(combined) + E(HLC) + E(ZPE)"
    program: "GAUSSIAN 03"
  G4_complete:
    source: G4_2007
    definition: "CCSD(T,full)/G3LargeXP // B3LYP/6-31G(2df,p) + HF-limit extrapolation + scaled B3LYP ZPE + atomic SO + REOPTIMISED HLC (fit to G2/91 test set, Table VI footnote: A=9.815, B=3.727, C=9.534, D=2.872, A'=9.871, E=4.904)"
    distinct_from_standard_G4: true
    note: "No additivity approximation; different HLC; assessed only on the 125-energy G2 test set. Must never match E1's 'standard G4'."
  G4_MP2:
    source: "Curtiss, Redfern, Raghavachari, J. Chem. Phys. 127, 124105 (2007), doi:10.1063/1.2770701 - NOT READ (paywalled)"
    definition_secondary: "Gaussian 09 manual (via rag-drg): keyword G4MP2 requests the reduced-order 'fourth generation' variant [Curtiss07a]."
    distinct_from_standard_G4: true
  standard_G3:
    source: G3_1998
    geometry: "HF/6-31G(d) initial; final MP2(full)/6-31G(d) (all electrons) (steps 1, 3)"
    zpe: "HF/6-31G(d) harmonic frequencies scaled by 0.8929 (step 2)"
    single_points: "MP4/6-31G(d) + dE(+) [MP4/6-31+G(d)] + dE(2df,p) + dE(QCI) [QCISD(T)/6-31G(d)] + dE(G3large) [MP2(full)/G3large based]; frozen core except MP2(full)/G3large"
    spin_orbit: "atomic species only (Table I); molecular SO explicitly NOT included"
    hlc_mhartree: {A: 6.386, B: 2.977, C: 6.219, D: 1.185}
    hlc_form: "-A n_beta - B(n_alpha-n_beta) molecules; -C n_beta - D(n_alpha-n_beta) atoms"
    hlc_fit_set: "G2/97 test set (299 energies; less three IPs)"
    final: "E0(G3) = E(combined) + E(HLC) + E(ZPE)"
    program: "GAUSSIAN 94 (original)"
  G3_MP2:
    source: G3MP2_1999
    definition: "MP2(full)/6-31G(d) geometry; QCISD(T)/6-31G(d) + dE(MP2) [MP2(fc)/G3MP2large - MP2/6-31G(d)] + atomic SO + HLC + ZPE (HF/6-31G(d) x 0.8929)"
    hlc_mhartree: {A: 9.279, B: 4.471, C: 9.345, D: 2.021}
    distinct_from_standard_G3: true
  G3X:
    source: G3X_2001
    definition: "G3 with B3LYP/6-31G(2df,p) geometry and ZPE (x0.9854) plus HF/G3XLarge correction (g functions on second row)"
    hlc_mhartree: {A: 6.783, B: 3.083, C: 6.877, D: 1.152}
    hlc_fit_set: "G3/99"
    distinct_from_standard_G3: true
  G3B3:
    source: "Baboul, Curtiss, Redfern, Raghavachari, J. Chem. Phys. 110, 7650 (1999), doi:10.1063/1.478676 - NOT READ (paywalled)"
    definition_secondary: "Gaussian 09 manual (via rag-drg): 'G3 variants using B3LYP structures and frequencies [Baboul99] are requested with the G3B3 and G3MP2B3 keywords.' Geometry basis/scale factor not verified from primary."
    distinct_from_standard_G3: true
    caution: "Not the same as the G3X paper's 'G3//B32df' (B3LYP/6-31G(2df,p), its own HLC)."
  formation_enthalpy:
    source: "G2/97 paper Eqs. (1)-(2), Table I; G4 paper p. 084108-5 ('calculated as in Ref. 18'); G3 paper p. 7767 ('as in Ref. 5')"
    route: "atomization: dfH(0K) = sum_atoms dfH0(atom,0K) - sum D0; dfH(298) = dfH(0K) + [H298-H0](molecule) - sum_atoms [H298-H0](element, standard state)"
    atomic_dfH_0K_kcal_mol: {H: "51.63 +/- 0.001", C: "169.98 +/- 0.1"}
    atomic_source: "JANAF (G2/97 Table I); boron from Ruscic et al. (irrelevant to hydrocarbons)"
    element_H298_minus_H0_kcal_mol: {H: 1.01, C: 0.25}
    element_note: "Per atom, elements in standard states (H2 gas, graphite), from JANAF"
    molecular_thermal_correction: "RRHO: harmonic vibrations from the recipe's scaled frequencies, classical translation (3/2 RT) and rotation (3/2 RT nonlinear, RT linear), plus PV; all modes harmonic incl. torsions"
    frequency_source_for_thermal_correction:
      G3: "scaled HF/6-31G(d) (G2/97 p. 1065; G3/05 p. 124107-2)"
      G4: "not explicitly stated in the G4 paper beyond 'as in Ref. 18'; by analogy with G3X (G3/05 p. 124107-2: scaled B3LYP/6-31G(2df,p)) presumably scaled B3LYP/6-31G(2df,p) - judgement call, unverified"
    relativistic: "Scalar relativistic effects not included in G4 (p. 084108-9)"
evidence_limits:
  - quote: "The A, A', B, C, and D values are chosen to give the smallest average absolute deviation from experiment for the whole G3/05 test set."
    source: "G4 paper p. 084108-3"
  - quote: "G3 ... A, B, C, D values are chosen to give the smallest average absolute deviation from experiment for the G2/97 test set (less three ionization potentials as noted below)."
    source: "G3 paper p. 7767"
  - statement: "The 38 hydrocarbons are inside both fit sets (G2/97 subset for G3's HLC: 22 of them; G3/05 for G4's HLC: all 38). The G4 vs G3 MAD (0.48 vs 0.69) is in-sample, development-set performance, not independent validation."
  - quote: "the largest improvement occurs for nonhydrogens ... The next largest improvement occurs for the 38 hydrocarbons for which the average absolute deviation decreases from 0.69 kcal/mol (G3) to 0.48 kcal/mol (G4)."
    source: "G4 paper p. 084108-5"
  - quote: "This approach depends on a cancellation of errors as well as well-defined parameters to achieve this."
    source: "G4 paper p. 084108-2"
  - statement: "Aggregate MADs only; the paper gives no per-molecule claim that G4 beats G3 for each member. Per-member G4 deviations exist (EPAPS Table 11) but per-member G3 deviations on the G3/05 experimental values were not found."
