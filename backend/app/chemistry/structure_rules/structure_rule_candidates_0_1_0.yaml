# Candidate structure-energy preference rules, audit manifest version 0.1.0 (2026-10-05).
#
# NOTHING HERE IS ACTIVE. Every entry has activation_approved: false, no owner acceptance and a list of blockers, and
# the registry (app.services.structure_selection.rules) loads this file only against its pinned SHA-256 and registers
# each entry INACTIVE. An agent never activates a rule: activation needs the owner's signed acceptance in this file AND
# the rule's predicates to be implemented and reviewed, and neither exists. A change to an entry, a blocker or a source
# list is a new manifest version, a new pin and a new rule version, never an in-place edit.
#
# Provenance of what follows. The council's relative-conformer-energy example (council rationale of 2026-10-04,
# section 3: "Revised ACONFL, Santra/Martin") was audited against Santra and Martin, J. Phys. Chem. A 126, 9375-9391
# (2022), doi:10.1021/acs.jpca.2c06407, which is open access (PMC9791657; arXiv 2209.03285). Which version each number
# was read from is stated in the sources below. The published PDF could not be downloaded (PMC and the publisher serve
# it behind a bot challenge); what was read is (1) the published open-access full text as Europe PMC serves it
# (JATS XML: text, tables and table footnotes of the journal version), (2) the arXiv v2 PDF, whose page numbers are
# the page anchors used here, and (3) the published Supporting Information PDF and data archive, both from Europe PMC.
# The numbers quoted below were compared between (1) and (2) and agree. Nothing was digitised from a figure.
#
# The other two council examples that could have become a preference rule are registered here too: the one proposed
# form with no source ("controlled convergence on one fixed model") as an inactive candidate with its missing
# prerequisites, and the three examples that support distinctions but are not preferences are listed under
# considered_not_rules so that their absence from the rules is a recorded decision.
