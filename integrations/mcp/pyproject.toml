[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tckdb-mcp"
version = "0.16.3"
description = "Read-only MCP server wrapping the TCKDB scientific API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TCKDB" }]
keywords = ["tckdb", "mcp", "chemistry", "kinetics", "thermo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
tckdb-mcp = "tckdb_mcp.server:main"

[project.urls]
Homepage = "https://github.com/TCKDB/TCKDB"
Repository = "https://github.com/TCKDB/TCKDB"
Issues = "https://github.com/TCKDB/TCKDB/issues"
Documentation = "https://tckdb.github.io/TCKDB/"
Source = "https://github.com/TCKDB/TCKDB/tree/main/integrations/mcp"
Changelog = "https://github.com/TCKDB/TCKDB/blob/main/integrations/mcp/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tckdb_mcp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
