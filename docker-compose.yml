# TCKDB Docker Compose stack. How to start it: docs/deployment/README.md.
# Every published port binds to 127.0.0.1, except the web UI (TCKDB_WEB_BIND)
# and Caddy (80 and 443 on every interface).

services:
  db:
    image: informaticsmatters/rdkit-cartridge-debian:Release_2025_03_3@sha256:96c34a5b88d0cbe02bf57290531f27f3cb97f5d3e494f03baea75ea99749b5ef
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-${DB_USER:-tckdb}}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD must be set (copy .env.example to .env or pass --env-file)}}
      POSTGRES_DB: ${DB_NAME:-tckdb_dev}
      # UTF8 cluster. Applies only when the volume is first created.
      LANG: C.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    # A changed DB_MAX_CONNECTIONS needs `up -d --force-recreate db`, not a restart.
    command:
      - postgres
      - -c
      - max_connections=${DB_MAX_CONNECTIONS:-200}
    # Loopback only; never publish Postgres on 0.0.0.0.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - tckdb_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-${DB_USER:-tckdb}} -d ${DB_NAME:-tckdb_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # S3 artifact store (optional: S3_ENDPOINT_URL can point at any S3 service).
  # Its internal ports take no credentials. Keep it on the `storage` network
  # only, publish nothing but 9000 on loopback, and install the host firewall
  # (docs/deployment/storage-firewall.md).
  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    # Refuses to start without SEAWEEDFS_JWT_KEY (16+ characters), which signs
    # the tokens the filer and volume server require.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ "$${#SEAWEEDFS_JWT_KEY}" -lt 16 ]; then
          echo "seaweedfs: SEAWEEDFS_JWT_KEY is unset or shorter than 16 characters; refusing to start an unauthenticated store (see docker-compose.yml, #545)" >&2
          exit 78
        fi
        export WEED_JWT_SIGNING_KEY="$${SEAWEEDFS_JWT_KEY}.volume-write"
        export WEED_JWT_SIGNING_READ_KEY="$${SEAWEEDFS_JWT_KEY}.volume-read"
        export WEED_JWT_FILER_SIGNING_KEY="$${SEAWEEDFS_JWT_KEY}.filer-write"
        export WEED_JWT_FILER_SIGNING_READ_KEY="$${SEAWEEDFS_JWT_KEY}.filer-read"
        exec /entrypoint.sh "$$@"
      - seaweedfs
    command:
      - mini
      - -dir=/data
      - -s3.port=9000
      - -master.telemetry=false
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-tckdb}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set (copy .env.example to .env or pass --env-file)}
      S3_BUCKET: ${S3_BUCKET:-tckdb-artifacts}
      SEAWEEDFS_JWT_KEY: ${SEAWEEDFS_JWT_KEY:-}
      WEED_GUARD_WHITE_LIST: "127.0.0.1,@"
    # `storage` only. Do not add `default`.
    networks:
      - storage
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
    volumes:
      - tckdb_seaweedfs:/data
    restart: unless-stopped
    # Healthy only if a signed request succeeds and an unsigned one gets 403.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null --aws-sigv4 aws:amz:us-east-1:s3 --user \"$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY\" http://127.0.0.1:9000/ && test $$(curl -s -o /dev/null -w %{http_code} http://127.0.0.1:9000/) = 403"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # MinIO, only for a deployment that already stores its artifacts in it.
  # The image is no longer published. Moving to SeaweedFS:
  # backend/docs/deployment/migrating_minio_to_seaweedfs.md.
  minio:
    profiles: ["minio"]
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-tckdb}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set (copy .env.example to .env or pass --env-file)}
    networks:
      - default
      - storage
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - tckdb_minio:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # --- selfhost profile: the API and web UI from the published images ---

  # Checks the secrets, sets up the database roles, migrates and creates the
  # first admin, then exits. Runs on every `up`; the API waits for it.
  init:
    profiles: ["selfhost"]
    image: laxzal/tckdb-api:${TCKDB_IMAGE_TAG:-0.4.1}
    env_file:
      - .env.selfhosted
      - .env.db-admin
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    command:
      - sh
      - -ec
      - |
        for v in DB_PASSWORD DB_ADMIN_PASSWORD DB_OWNER_PASSWORD S3_ACCESS_KEY S3_SECRET_KEY SEAWEEDFS_JWT_KEY PAGING_CURSOR_KEY; do
          case "$$(printenv "$$v" || true)" in
            ""|change-me*) echo "init: $$v is empty or still a change-me placeholder; generate the env files with backend/scripts/ops/tckdb_make_env.sh" >&2; exit 1 ;;
          esac
        done
        roles() { python scripts/configure_database_roles.py "$$@"; }
        if ! roles check; then echo "init: role check failed; provisioning the role split" >&2; roles apply; fi
        alembic upgrade head
        roles check
        set -- --role admin --username "$${TCKDB_BOOTSTRAP_USERNAME:?set TCKDB_BOOTSTRAP_USERNAME in .env.db-admin}"
        if [ -n "$${TCKDB_BOOTSTRAP_EMAIL:-}" ]; then set -- "$$@" --email "$$TCKDB_BOOTSTRAP_EMAIL"; fi
        python scripts/bootstrap_admin.py "$$@"
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: "no"

  # The web UI proxies /api/ to the host name `tckdb-api`; keep the name.
  tckdb-api:
    profiles: ["selfhost"]
    image: laxzal/tckdb-api:${TCKDB_IMAGE_TAG:-0.4.1}
    env_file:
      - .env.selfhosted
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      S3_ENDPOINT_URL: http://seaweedfs:9000
    networks:
      - default
      - storage
    ports:
      - "127.0.0.1:${TCKDB_API_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "/opt/conda/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/v1/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Web UI. TCKDB_WEB_BIND set to a LAN address opens it to the lab network.
  frontend:
    profiles: ["selfhost"]
    image: laxzal/tckdb-frontend:${TCKDB_IMAGE_TAG:-0.4.1}
    ports:
      - "${TCKDB_WEB_BIND:-127.0.0.1}:${TCKDB_WEB_PORT:-8011}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      tckdb-api:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Optional upload worker (`--profile worker`). Set TCKDB_INLINE_WORKER=false
  # in .env.selfhosted when you run it.
  worker:
    profiles: ["worker"]
    image: laxzal/tckdb-api:${TCKDB_IMAGE_TAG:-0.4.1}
    command: ["python", "-m", "app.workers.upload_worker"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-tckdb}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-tckdb_dev}
      S3_ENDPOINT_URL: http://seaweedfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tckdb}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-tckdb-artifacts}
      TCKDB_INLINE_WORKER: "false"
    networks:
      - default
      - storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # HTTPS for TCKDB_DOMAIN (`--profile caddy`). The domain's DNS record must
  # point at this host, and 80 and 443 must be reachable for the certificate.
  caddy:
    profiles: ["caddy"]
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    entrypoint:
      - /bin/sh
      - -c
      - |
        refuse() { echo "caddy: $$1" >&2; sleep 60; exit 78; }
        if [ -z "$${TCKDB_DOMAIN}" ]; then
          refuse "TCKDB_DOMAIN is not set; set it in .env.selfhosted to the domain name this server answers to"
        fi
        export TCKDB_CADDY_TLS="$${TCKDB_CADDY_TLS:-acme}"
        case "$$TCKDB_CADDY_TLS" in
          acme|acme_email|internal) ;;
          *) refuse "TCKDB_TLS must be empty or internal, got '$$TCKDB_CADDY_TLS'" ;;
        esac
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      TCKDB_DOMAIN: ${TCKDB_DOMAIN:-}
      TCKDB_ACME_EMAIL: ${TCKDB_ACME_EMAIL:-}
      TCKDB_CADDY_TLS: ${TCKDB_TLS:-${TCKDB_ACME_EMAIL:+acme_email}}
    ports:
      - "${TCKDB_HTTP_PORT:-80}:80"
      - "${TCKDB_HTTPS_PORT:-443}:443"
      - "${TCKDB_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - tckdb_caddy_data:/data
      - tckdb_caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Cloudflare Tunnel (`--profile cloudflare`), using CLOUDFLARED_TUNNEL_TOKEN.
  # Do not also run cloudflared as a host service.
  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:-}
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# Only services you would trust with S3_SECRET_KEY may join `storage`.
networks:
  default:
  storage:

volumes:
  tckdb_pgdata:
  tckdb_seaweedfs:
  tckdb_minio:
  tckdb_caddy_data:
  tckdb_caddy_config:
